<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout - Flexivel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
   <main class="login-page">

    <section class="login-panel">
        
        <div class="logo">
             <img src="asse/riot-logo.png" alt="Logo Riot Games" class="logo">
        </div>
        <div class="login-content">
            <h1>Fazer login</h1>

            <form class="login-form">
                <label for="username">Nome De Usuario:</label>
                <input 
                type="text"
                id="username"
                placeholder="Nome de Usuario"
                >

                <label for="password">Senha:</label>
                <input
                type="password"
                id="password"
                placeholder="senha">


                <button type="submit" class="botão">Entrar</button>

               

                <label class="remember">
                    <input type="checkbox" disabled>
                       Manter login
                </label>

                <div class="social-login">
                    <button type="button" class="social-icon">
                        <img src="asse/google_sem_fundo.png"  class="logo1">
                    </button>
                    
                        <button type="button" class="social-icon">
                            <img src="asse/facebook_sem_fundo.png"  class="logo2">
                        </button>

                        <button type="button" class="social-icon">
                             <img src="asse/Emblema Xbox Branco em Transparência.png"  class="logo3">
                        </button>
                </div>
                

                <button type="submit" class="submit-button"></button>

            </form>
            <div class="help-links">

                <a href="#">NÃO CONSEGUE INICIAL SESSÃO?</a>

                <a href="#">CRIAR CONTA</a>

            </div>
        </div>
    </section>
   </main> 

   <script>
     document.querySelector(".login-form").addEventListener("submit", function(event) {
            event.preventDefault();

             alert("Este é apenas um projeto demonstrativo!");
        });
   </script>
</body>
</html>
